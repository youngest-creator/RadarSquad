{% extends 'core/base.html' %}
{% block content %}
<div style="text-align: center; margin-bottom: 35px;">
    <h1 style="font-family: 'Orbitron', sans-serif; font-size: 32px; margin-bottom: 10px;">ВЫБЕРИ СВОЮ ДИСЦИПЛИНУ</h1>
    <p style="color: var(--text-muted);">Переходи на радар нужной игры, смотри карточки игроков и собирай сквад</p>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 25px;">
    {% for slug, g in games.items %}
    <a href="{% url 'dashboard' slug %}" style="text-decoration: none; color: inherit;">
        <div class="card" style="padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 260px; position: relative;">
            <div style="height: 165px; background: url('{{ g.banner }}') center/cover no-repeat; position: relative;">
                <div style="position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-card), transparent);"></div>
                <span style="position: absolute; top: 15px; right: 15px; font-size: 28px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 10px;">{{ g.icon }}</span>
            </div>
            <div style="padding: 15px 22px; display: flex; justify-content: space-between; align-items: center; flex: 1;">
                <div>
                    <h2 style="font-family: 'Orbitron', sans-serif; font-size: 20px;">{{ g.name }}</h2>
                    <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Рейтинг: {{ g.rating_label }}</p>
                </div>
                <span class="btn-neon" style="padding: 8px 16px; font-size: 13px;">Открыть →</span>
            </div>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
